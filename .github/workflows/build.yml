name: Build Goldazi APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependências do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential python3-dev git zip unzip openjdk-17-jdk \
            autoconf libtool pkg-config zlib1g-dev libncurses5-dev \
            libncursesw5-dev libreadline-dev libsqlite3-dev libgdbm-dev \
            libdb5.3-dev libbz2-dev libexpat1-dev liblzma-dev tk-dev \
            libffi-dev libssl-dev cmake ninja-build lld ccache

      - name: Instalar Buildozer e Cython
        run: |
          pip install --upgrade pip setuptools
          pip install "cython==0.29.33" buildozer

      - name: Aceitar Licenças do Android SDK
        run: |
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Compilar APK com Buildozer
        run: |
          buildozer -v android debug

      - name: Guardar o APK gerado
        uses: actions/upload-artifact@v4
        with:
          name: GoldaziTimer-APK
          path: bin/*.apk
